[project]
name = "multi-agent-financial-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabian Robert Banu Stan", email = "private.hruodberht@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.13.0",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "langchain-community>=0.3.31",
    "langchain-core>=0.3.86",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.11",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.50.0",
    "uvicorn>=0.39.0",
    "yfinance>=1.2.0",
]

[project.scripts]
multi-agent-financial-app = "multi_agent_financial_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
